name: DD Connector
version: "2.0.0"
slug: dd_connector
description: Connect selected Home Assistant entities to DD Cloud or a local physical Core
arch: [amd64, aarch64]
startup: services
boot: auto
init: false
homeassistant_api: true
options:
  relay_url: ""
  shared_entities: ""
  transport: cloud
  local_core_url: ""
  local_core_sha256: ""
schema:
  relay_url: url
  shared_entities: str
  transport: list(cloud|local)
  local_core_url: str
  local_core_sha256: str

ingress: true
ingress_port: 8099
panel_title: DD Connector
panel_icon: mdi:lan-connect
panel_admin: true
